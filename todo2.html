.sp-ov.show{opacity:1;pointer-events:auto}
.sp{position:absolute;left:0;bottom:0;width:100%;background:var(--c);border-radius:14px 14px 0 0;z-index:10000;max-height:85%;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}

var dow=now.getDay()||7,ws=new Date(now);ws.setDate(now.getDate()-dow+1);ws.setHours(0,0,0,0);
var we=new Date(ws);we.setDate(ws.getDate()+7);
sl.forEach(function(t){var d=new Date((t.ts||0)*1000);(d>=ws&&d<we?foc:rest).push(t)})
}
var fl=FR==='today'?'📌 今天':FR==='24h'?'⏳ 未来24小时':'📅 本周';
var h='<div class="fc-s"><div class="fc-h"><span class="fc-t">'+fl+'</span><span class="fc-n">'+foc.length+' 项</span></div>';
if(foc.length){
h+=foc.map(function(t){
var idx=T.indexOf(t);
var meta='';
if(VF.alert_time){meta+=cd(t.ts);if(t.rp)meta+='（'+t.rp+'）'}
return'<div class="fc-it" onclick="SD('+idx+')"><span class="fc-ic">⏰</span><div class="fc-ct"><div class="fc-tx">'+t.s+'</div>'+mkDet(t)+'<div class="fc-dt">'+meta+'</div></div>'+mkTags(t)+'</div>'
}).join('')
}else{
h+='<div style="text-align:center;padding:12px;color:#bbb;font-size:13px">🎉 当前时段暂无待提醒事项</div>'
}
h+='</div>';
if(rest.length){
var rg={},ro=[];
rest.forEach(function(t){var k=dk(t.ts);if(!rg[k]){rg[k]=[];ro.push(k)};rg[k].push(t)});
ro.sort();
h+='<div style="padding:6px 0 4px;font-size:12px;font-weight:600;color:var(--t2)">📋 其他日期待提醒</div>';
ro.forEach(function(k){
h+='<div class="fc-cd" onclick="TG(this)"><span class="fc-cl">▸ '+dl(k)+'</span><span class="fc-cc">'+rg[k].length+'</span></div>';
h+='<div style="display:none">';
h+=rg[k].map(function(t){
var idx=T.indexOf(t);
return'<div class="it" onclick="SD('+idx+')"><div class="ic">⏰</div><div class="ct"><div class="tx">'+t.s+'</div>'+mkDet(t)+'<div class="tm">'+mkMeta(t)+'</div></div>'+mkTags(t)+'<div class="ar">›</div></div>'
}).join('');
h+='</div>'
})
}
return h
}
function TG(el){var n=el.nextElementSibling;if(n)n.style.display=n.style.display==='none'?'block':'none'}
/* 滚动到今天（或离今天最近的日期）*/
function scT(){
var ls=$('ls');if(!ls)return;
var t=td();
/* 1. 先尝试精确匹配今天 */
var el=document.getElementById('d-'+t);
/* 2. 如果今天没有，找离今天最近的日期锚点 */
if(!el){
var all=ls.querySelectorAll('[id^="d-"]');
var best=null,bd=Infinity,now=new Date(t+'T00:00:00').getTime();
for(var i=0;i<all.length;i++){
var id=all[i].id,dateStr=id.replace(/^d-/,'').replace(/-\d+$/,'');
if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr))continue;
var df=Math.abs(new Date(dateStr+'T00:00:00').getTime()-now);
if(df<bd){bd=df;best=all[i]}
}
el=best
}
if(el)el.scrollIntoView({block:'center'})
}
/* 主渲染入口 */
function render(scroll){
var ls=$('ls'),sts=document.querySelector('.sts');
if(V==='list'){sts.style.display='flex';ls.innerHTML=rL(srt(T.filter(function(t){return t.st===F})))}
else{sts.style.display='none';var all=srt(T);ls.innerHTML=V==='timeline'?rT(all):rF(all)}
if(scroll!==false)requestAnimationFrame(function(){setTimeout(scT,50)})
}
function SW(f){
F=f;var ts=Q('.st');
for(var i=0;i<ts.length;i++)ts[i].className='st';
$(f==='scheduled'?'tb0':f==='completed'?'tb1':'tb2').className='st on';
render(false)
}
function SV(v){
V=v;var os=Q('#lyO .st-opt');
for(var j=0;j<os.length;j++)os[j].classList.toggle('on',os[j].getAttribute('data-ly')===v);
render()
}
/* 详情弹窗 */
function SD(i){
var t=T[i],r='';
r+='<div class="tt-r"><span class="tt-l">提醒事件</span><span class="tt-v">'+t.s+'</span></div>';
r+='<div class="tt-r"><span class="tt-l">提醒时间</span><span class="tt-v">'+(t.at||'未设置')+'</span></div>';
if(t.d)r+='<div class="tt-r"><span class="tt-l">任务详情</span><span class="tt-v">'+t.d+'</span></div>';
r+='<div class="tt-r"><span class="tt-l">周期频率</span><span class="tt-v">'+(t.rf||'单次提醒')+'</span></div>';
r+='<div class="tt-r"><span class="tt-l">当前状态</span><span class="tt-v st-'+(t.st==='scheduled'?'s':t.st==='completed'?'c':'d')+'">'+stx(t.st)+'</span></div>';
r+='<div class="tt-r"><span class="tt-l">创建时间</span><span class="tt-v">'+(fmt(t.ca)||'未知')+'</span></div>';
if(t.st==='completed'&&t.coa)r+='<div class="tt-r"><span class="tt-l">完成时间</span><span class="tt-v">'+fmt(t.coa)+'</span></div>';
if(t.st==='deleted'&&t.da)r+='<div class="tt-r"><span class="tt-l">删除时间</span><span class="tt-v">'+fmt(t.da)+'</span></div>';
var ov=document.createElement('div');ov.className='ov';ov.id='curOv';
ov.innerHTML='<div class="tt"><div class="tt-h">📌 '+t.s+'</div><div class="tt-b">'+r+'</div><div class="tt-a" id="tB"></div><div class="tt-c" id="tC">关闭</div></div>';
document.body.appendChild(ov);
var ba=$('tB');
if(t.st==='scheduled'){
aB(ba,'bd','✅ 标记完成',function(){ACT(i,'completed')});
aB(ba,'bl','🚫 删除',function(){ACT(i,'deleted')})
}else if(t.st==='completed'){
aB(ba,'bl','🚫 删除',function(){ACT(i,'deleted')})
}else if(t.st==='deleted'){
aB(ba,'br','⏰ 恢复提醒',function(){ACT(i,'scheduled')});
aB(ba,'bd','✅ 标记完成',function(){ACT(i,'completed')})
}
$('tC').onclick=CLO;
ov.onclick=function(e){if(e.target===ov)CLO()}
}
function aB(p,c,tx,fn){var b=document.createElement('button');b.className=c;b.innerHTML=tx;b.onclick=fn;p.appendChild(b)}
function CLO(){var ov=$('curOv');if(ov){ov.className='ov rm';setTimeout(function(){ov.remove()},150)}}
function ACT(i,ns){
var t=T[i],now=Math.floor(Date.now()/1000);
t.st=ns;
if(ns==='completed')t.coa=now;
if(ns==='deleted')t.da=now;
UC();CLO();render()
}
function UC(){
var s=0,c=0,d=0;
T.forEach(function(t){if(t.st==='scheduled')s++;else if(t.st==='completed')c++;else if(t.st==='deleted')d++});
document.querySelector('#tb0 b').textContent=s;
document.querySelector('#tb1 b').textContent=c;
document.querySelector('#tb2 b').textContent=d;
document.querySelector('.ft span').textContent='共 '+T.length+' 项 · 待提醒 '+s+' · 已完成 '+c+' · 已删除 '+d
}
/* 初始化 */
(function(){
var d=new Date(),o={year:'numeric',month:'long',day:'numeric',weekday:'long'};
$('dt').textContent=d.toLocaleDateString('zh-CN',o);
render()
})();
</script>
